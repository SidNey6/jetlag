name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Regionsdaten einmal im Monat aus frischen OpenStreetMap-Auszügen bauen
    - cron: '17 4 3 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxprüfung der Module
        run: ./scripts/check.sh
      - name: Tests
        run: node --test test/*.test.mjs

  # Vorgebaute Regionsdaten (data/). Gebaut wird nur, wenn sich das Bau-Skript geändert
  # hat oder ein neuer Monat begonnen hat – sonst kommt der Stand aus dem Cache und
  # Geofabrik wird nicht bei jedem Push belastet.
  region:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache-Schlüssel
        id: key
        run: echo "key=region-$(date -u +%Y-%m)-${{ hashFiles('scripts/region/**', 'js/osmgeo.js', 'js/sources.js', 'js/geo.js') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: data
          key: ${{ steps.key.outputs.key }}
          # Fällt der Neubau aus (Geofabrik nicht erreichbar), bleibt der letzte Stand
          restore-keys: region-
      # Jede Region muss ganz in ihren Auszügen liegen, sonst fehlen am Rand Daten
      - name: Abdeckung prüfen
        id: coverage
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: node scripts/region/coverage.mjs
      - name: OSM-Auszüge laden
        id: download
        if: steps.cache.outputs.cache-hit != 'true' && steps.coverage.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/osm"
          node --input-type=module -e "import { REGIONS } from './scripts/region/regions.mjs'; for (const r of Object.values(REGIONS)) for (const u of r.sources) console.log(u)" | sort -u > "$RUNNER_TEMP/osm/urls.txt"
          # vier gleichzeitig; ein Fehler bricht den Schritt ab
          xargs -P 4 -n 1 sh -c 'curl -fsSL --retry 3 --retry-delay 20 -o "$RUNNER_TEMP/osm/$(basename "$0")" "$0"' < "$RUNNER_TEMP/osm/urls.txt"
          ls -la "$RUNNER_TEMP/osm"
      # Je Region: Ortsdaten, Höhen (AWS Terrain Tiles), Karte (Protomaps). Schlägt etwas
      # fehl, bleibt für diese Region der letzte Stand bzw. die App fragt online nach.
      - name: Regionen bauen
        if: steps.cache.outputs.cache-hit != 'true' && steps.download.outcome == 'success'
        run: |
          regionen=$(node --input-type=module -e "import { REGIONS } from './scripts/region/regions.mjs'; console.log(Object.keys(REGIONS).join(' '))")
          for region in $regionen; do
            echo "::group::$region"
            args=""
            for url in $(node --input-type=module -e "import { REGIONS } from './scripts/region/regions.mjs'; console.log(REGIONS['$region'].sources.join(' '))"); do
              args="$args --pbf $RUNNER_TEMP/osm/$(basename "$url")"
            done
            if node --max-old-space-size=6144 scripts/region/build.mjs "$region" $args; then
              node scripts/region/elevation.mjs "$region" || echo "::warning::Höhen $region fehlgeschlagen"
              node scripts/region/basemap.mjs "$region" || echo "::warning::Karte $region fehlgeschlagen"
            else
              echo "::warning::Region $region fehlgeschlagen"
            fi
            echo "::endgroup::"
          done
          du -sh data/*
      - name: Daten vorhanden?
        run: test -f data/regions.json && du -sh data
      - uses: actions/upload-artifact@v4
        with:
          name: region-data
          path: data
          retention-days: 3

  deploy:
    needs: [test, region]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: region-data
          path: data
      - name: Nur die Website veröffentlichen
        run: rm -rf native
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Android-App: je App-Version ein GitHub-Release mit signierter APK. Läuft nur, wenn der
  # Signaturschlüssel als Secret hinterlegt ist – immer derselbe, sonst ließe sich die
  # neue APK nicht über die installierte legen.
  android:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.JETLAG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Neue Version?
        id: check
        run: |
          v=$(sed -n 's/.*"version": *"\(v[0-9.]*\)".*/\1/p' version.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Kein Signaturschlüssel hinterlegt – keine APK"
          elif gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v gibt es schon"
          else
            echo "build=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.build
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.check.outputs.build
        with:
          distribution: temurin
          java-version: 21
      - name: APK bauen
        if: steps.check.outputs.build
        working-directory: native
        env:
          JETLAG_STORE_PASSWORD: ${{ secrets.JETLAG_STORE_PASSWORD }}
          JETLAG_KEY_PASSWORD: ${{ secrets.JETLAG_STORE_PASSWORD }}
          JETLAG_KEY_ALIAS: jetlag
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export JETLAG_STORE_FILE="$RUNNER_TEMP/release.jks"
          npm ci
          npm run apk
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/jetlag-toolkit.apk"
      - name: Release anlegen
        if: steps.check.outputs.build
        run: |
          v="${{ steps.check.outputs.version }}"
          gh release create "$v" "$RUNNER_TEMP/jetlag-toolkit.apk" --target "$GITHUB_SHA" \
            --title "Jetlag Toolkit $v (Android)" \
            --notes "Android-App mit Endgame-Aufzeichnung im Hintergrund. Auf dem Handy herunterladen und installieren (einmalig „Installation aus unbekannten Quellen“ erlauben). Neue Versionen lassen sich über die alte installieren; der Spielstand bleibt erhalten."
